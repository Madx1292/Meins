html,body{margin:0;padding:0;background:#FFFFFF}

/* ===== Wurzel ===== */
#awa-lernziele{
  --ink:#384654;--muted:#5a7077;--head:#075b66;--deep:#0c5469;--petrol:#13808c;--navy:#0C2630;
  --gold:#fec70b;--sky:#a6c5c9;--line:#dce5e7;--line2:#c4d8dc;--red:#d7382c;
  --ease:cubic-bezier(.2,.7,.25,1);--soft:cubic-bezier(.33,1,.68,1);
  position:relative;box-sizing:border-box;max-width:1180px;margin:0 auto;padding:10px 16px 14px;
  color:var(--ink);font:400 17px/1.55 "Be Vietnam Pro","BeVietnamLocal",Arial,sans-serif;-webkit-font-smoothing:antialiased}
#awa-lernziele *,#awa-lernziele *::before,#awa-lernziele *::after{box-sizing:border-box}
#awa-lernziele [hidden]{display:none!important}
#awa-lernziele svg.awa-i{width:17px;height:17px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ===== Bühne ===== */
#awa-lernziele .awa-stage{position:relative;overflow:hidden;border-radius:20px;background:#f2f8fa;
  isolation:isolate;outline:none;touch-action:pan-y;-webkit-user-select:none;user-select:none;cursor:grab;
  box-shadow:0 28px 60px -26px #0c263045,0 2px 10px #0c263014,0 0 0 1px #dce5e7}
#awa-lernziele .awa-stage.drag{cursor:grabbing}
#awa-lernziele .awa-stage:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
#awa-lernziele .awa-scene{position:absolute;left:0;top:0;will-change:transform}
#awa-lernziele .awa-hall,#awa-lernziele .awa-ray,#awa-lernziele .awa-world{position:absolute;left:0;top:0;width:100%;height:100%}
#awa-lernziele .awa-ray{pointer-events:none;opacity:.5;background-repeat:no-repeat;background-size:100% 240%;
  background-image:linear-gradient(180deg,#fec70b00 0%,#fec70b00 36%,#fec70b99 45%,#fffdf2e6 50%,#fec70b99 55%,#fec70b00 64%,#fec70b00 100%);
  animation:awa-ray 7s cubic-bezier(.52,0,.86,.42) infinite}
@keyframes awa-ray{0%{background-position:0 0}100%{background-position:0 100%}}
#awa-lernziele .awa-world>*{position:absolute;left:0;top:0;transform-origin:0 0}

/* ===== Hallen-Elemente ===== */
#awa-lernziele .awa-rib{border-radius:3px;
  background:linear-gradient(180deg,#ffffff00,#ffffffe6 20%,#e9f4f5 56%,#ffffff00);
  box-shadow:0 0 14px #ffffffc4}
#awa-lernziele .awa-ceil{border-radius:5px;
  background:linear-gradient(90deg,#ffffff00,#ffffff 22%,#ffffff 78%,#ffffff00);
  box-shadow:0 0 18px 5px #ffffffd9,0 0 44px 14px #bdeef199}
#awa-lernziele .awa-fbar{border-radius:2px;
  background:linear-gradient(90deg,#13808c00,#13808c5c 25%,#fec70b94 50%,#13808c5c 75%,#13808c00)}
#awa-lernziele .awa-mote>i{display:block;width:4px;height:4px;border-radius:50%;background:#fff;
  box-shadow:0 0 7px 2px #ffffffe6;animation:awa-float 11s ease-in-out infinite}
@keyframes awa-float{0%{transform:translate(0,7px)}50%{transform:translate(4px,-7px)}100%{transform:translate(0,7px)}}
#awa-lernziele .awa-wash{border-radius:50%;
  background:radial-gradient(circle at 50% 50%,var(--w1) 0%,var(--w2) 44%,transparent 72%)}
#awa-lernziele .awa-pool{border-radius:50%;
  background:radial-gradient(ellipse 34% 46% at 50% 50%,#0c263030 0%,transparent 72%),
             radial-gradient(ellipse 50% 50% at 50% 50%,var(--w1) 0%,transparent 70%)}

/* ===== Exponate an den Wänden ===== */
#awa-lernziele .awa-walls{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
#awa-lernziele .awa-ex{position:absolute;left:0;top:0;transform-origin:50% 50%;visibility:hidden;
  -webkit-backface-visibility:hidden;backface-visibility:hidden;will-change:transform}
#awa-lernziele .awa-exf{position:relative;padding:13px;border-radius:3px;
  background:linear-gradient(170deg,#ffffff,#f7fbfb);
  box-shadow:0 0 0 1px #cadce0,0 0 0 4px #ffffff,0 26px 46px -20px #0c263070;overflow:hidden}
#awa-lernziele .awa-exi{position:relative;overflow:hidden;border-radius:2px;background:#eef5f7;
  box-shadow:inset 0 0 0 1px #dfebed}
#awa-lernziele .awa-exi{background-repeat:no-repeat;filter:saturate(.84) contrast(.96)}
#awa-lernziele .awa-exi::after{content:"";position:absolute;inset:0;background:#f7fbfc;opacity:.14}
/* Leise: die Seiten liegen wie eine blasse Projektion auf der Wand, ohne Rahmen und Schild */
#awa-lernziele .awa-walls.quiet .awa-exp{display:none}
#awa-lernziele .awa-walls.quiet .awa-exf{padding:0;background:none;box-shadow:none}
#awa-lernziele .awa-walls.quiet .awa-exi{border-radius:0;box-shadow:none;
  filter:grayscale(.9) brightness(1.24) contrast(.6) sepia(.3) hue-rotate(145deg) saturate(1.3)}
#awa-lernziele .awa-walls.quiet .awa-exi::after{background:#eef6f7;opacity:.4}
#awa-lernziele .awa-exp{display:flex;align-items:flex-start;gap:.55em;margin-top:.65em;padding-left:.2em}
#awa-lernziele .awa-exp i{display:block;width:1em;height:2px;border-radius:1px;flex:none;margin-top:.62em;
  background:linear-gradient(90deg,var(--petrol),var(--gold))}
#awa-lernziele .awa-exp b{display:block;color:var(--head);font-size:1.06em;font-weight:500;
  line-height:1.25;letter-spacing:.005em}
#awa-lernziele .awa-exp span{display:block;margin-top:.1em;color:var(--muted);font-size:.86em;line-height:1.3}
/* ===== Lernziel-Tafel: erst Gemälde, dann Inhalt ===== */
#awa-lernziele .awa-plate{display:flex;flex-direction:column;visibility:hidden;will-change:transform;cursor:pointer;
  padding:calc(24px*var(--sp,1)) calc(26px*var(--sp,1)) calc(22px*var(--sp,1));
  border-radius:calc(18px*var(--sp,1));
  background:linear-gradient(168deg,#ffffff 0%,#fdfefe 46%,#f0f7f9 100%);
  box-shadow:0 0 0 1px #d6e4e6,0 1px 0 #ffffff inset,0 34px 60px -26px #0c263052,0 10px 22px -14px #0c263026;
  overflow:hidden}
#awa-lernziele .awa-plate::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;z-index:3;
  background:linear-gradient(90deg,var(--a1),var(--a2) 55%,#ffffff00)}
#awa-lernziele .awa-plate::after{content:"";position:absolute;inset:0;z-index:4;pointer-events:none;
  background:#ffffff;opacity:var(--veil,0)}
#awa-lernziele .awa-plate>*{position:relative;z-index:2}
/* Passepartout und Prägesiegel */
#awa-lernziele .awa-mat{position:absolute;z-index:0;inset:calc(9px*var(--sp,1));
  border:1px solid #e3ecee;border-radius:calc(10px*var(--sp,1));pointer-events:none}
#awa-lernziele .awa-seal{position:absolute;z-index:1;right:calc(13px*var(--sp,1));bottom:calc(12px*var(--sp,1));
  width:calc(86px*var(--k,1));height:calc(86px*var(--k,1));opacity:.11;pointer-events:none}
#awa-lernziele .awa-seal svg{width:100%;height:100%;overflow:visible}
#awa-lernziele .awa-sheen{position:absolute;z-index:5;top:0;bottom:0;left:-45%;width:34%;pointer-events:none;
  background:linear-gradient(100deg,#ffffff00,#ffffffe6,#ffffff00);transform:skewX(-16deg);opacity:0}
#awa-lernziele .awa-plate.open .awa-sheen{animation:awa-sheen 1.3s .05s var(--soft) 1}
@keyframes awa-sheen{0%{left:-45%;opacity:.9}100%{left:120%;opacity:0}}
/* Die große Zahl: das Bild, solange es geschlossen ist */
#awa-lernziele .awa-big{position:absolute;z-index:2;left:50%;top:45%;
  transform:translate(-50%,-50%);font-size:calc(152px*var(--k,1));line-height:.78;font-weight:500;
  letter-spacing:-.045em;color:transparent;-webkit-text-fill-color:transparent;
  -webkit-background-clip:text;background-clip:text;
  background-image:linear-gradient(102deg,#d3e2e4 0%,var(--a2) 26%,var(--gold) 45%,var(--a2) 62%,#d3e2e4 100%);
  background-size:300% 100%;animation:awa-shine 7.5s linear infinite;
  transition:opacity .5s var(--ease),transform .75s var(--soft);pointer-events:none}
@keyframes awa-shine{0%{background-position:170% 0}100%{background-position:-130% 0}}
#awa-lernziele .awa-plate.open .awa-big{opacity:0;transform:translate(-50%,-50%) scale(1.3)}
#awa-lernziele .awa-hang{position:absolute;z-index:2;left:50%;bottom:calc(20px*var(--sp,1));
  transform:translateX(-50%);display:flex;align-items:center;gap:7px;white-space:nowrap;
  color:var(--muted);font-size:calc(12.5px*var(--k,1));letter-spacing:.14em;
  transition:opacity .4s var(--ease)}
#awa-lernziele .awa-hang i{display:block;width:5px;height:5px;border-radius:50%;background:var(--gold);
  animation:awa-beat 2.1s ease-in-out infinite}
@keyframes awa-beat{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
#awa-lernziele .awa-plate.open .awa-hang{opacity:0}
/* Kopfzeile */
#awa-lernziele .awa-ptop{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
#awa-lernziele .awa-plab{display:inline-flex;align-items:center;gap:7px;color:var(--petrol);opacity:.6;
  font-size:calc(12.5px*var(--k,1));letter-spacing:.22em;transition:opacity .5s var(--ease)}
#awa-lernziele .awa-plate.open .awa-plab{opacity:1}
#awa-lernziele .awa-plab svg{width:calc(14px*var(--k,1));height:calc(14px*var(--k,1));flex:none;
  fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#awa-lernziele .awa-pno{margin-top:calc(-7px*var(--k,1));font-size:calc(44px*var(--k,1));line-height:1;
  font-weight:500;letter-spacing:-.03em;color:transparent;-webkit-text-fill-color:transparent;
  -webkit-background-clip:text;background-clip:text;opacity:0;transform:scale(.72);transform-origin:100% 0;
  background-image:linear-gradient(170deg,var(--a2) 0%,#cfe2e4 92%);
  transition:opacity .5s .15s var(--ease),transform .6s .15s var(--soft)}
#awa-lernziele .awa-plate.open .awa-pno{opacity:1;transform:none}
/* Motiv */
#awa-lernziele .awa-pill{position:relative;flex:1;min-height:0;margin:calc(4px*var(--sp,1)) 0 calc(10px*var(--sp,1))}
#awa-lernziele .awa-pill svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;
  opacity:.17;transition:opacity .8s var(--ease)}
#awa-lernziele .awa-plate.open .awa-pill svg{opacity:1}
/* Titel und Schlagworte */
#awa-lernziele .awa-pt{position:relative;margin:0 0 calc(11px*var(--sp,1));padding-bottom:calc(9px*var(--sp,1));
  color:var(--head);font-size:calc(25px*var(--k,1));line-height:1.18;font-weight:500;letter-spacing:-.005em;
  opacity:0;transform:translateY(9px);transition:opacity .5s .1s var(--ease),transform .6s .1s var(--soft)}
#awa-lernziele .awa-plate.open .awa-pt{opacity:1;transform:none}
#awa-lernziele .awa-pt::after{content:"";position:absolute;left:0;bottom:0;height:2px;width:0;
  background:linear-gradient(90deg,var(--a1),#ffffff00);transition:width .9s .35s var(--soft)}
#awa-lernziele .awa-plate.open .awa-pt::after{width:calc(62px*var(--k,1))}
#awa-lernziele .awa-pc{display:flex;flex-wrap:wrap;gap:calc(7px*var(--sp,1))}
#awa-lernziele .awa-pc span{padding:calc(5px*var(--sp,1)) calc(11px*var(--sp,1));border-radius:13px;
  border:1px solid var(--line2);background:linear-gradient(180deg,#ffffff,#f3f9fa);color:var(--deep);
  font-size:calc(13.5px*var(--k,1));line-height:1.25;opacity:0;transform:translateY(6px)}
#awa-lernziele .awa-plate.open .awa-pc span{animation:awa-rise .5s var(--soft) both;animation-delay:calc(.34s + var(--d,0ms))}
@keyframes awa-rise{to{opacity:1;transform:none}}

/* ===== Bildmotive ===== */
#awa-lernziele .s1{fill:none;stroke:#0c5469;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#awa-lernziele .s2{fill:none;stroke:#a6c5c9;stroke-width:1.5;stroke-linecap:round}
#awa-lernziele .s3{fill:none;stroke:#13808c;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#awa-lernziele .gd{fill:#fec70b}
#awa-lernziele .gs{fill:none;stroke:#fec70b;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
#awa-lernziele .rd{fill:#d7382c}
#awa-lernziele .rs{fill:none;stroke:#d7382c;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#awa-lernziele .lb{fill:#0c5469;font:500 12px "Be Vietnam Pro","BeVietnamLocal",Arial,sans-serif;letter-spacing:.1em}
#awa-lernziele .lbg{fill:#9a7200;font:500 12px "Be Vietnam Pro","BeVietnamLocal",Arial,sans-serif;letter-spacing:.1em}
#awa-lernziele .awa-pill svg *{animation-play-state:paused}
#awa-lernziele .awa-plate.open .awa-pill svg *{animation-play-state:running}
#awa-lernziele .mer{transform-box:fill-box;transform-origin:center;animation:awa-mer 7s linear infinite}
#awa-lernziele .mer.b{animation-delay:-2.33s}
#awa-lernziele .mer.c{animation-delay:-4.66s}
@keyframes awa-mer{0%{transform:scaleX(1)}50%{transform:scaleX(-1)}100%{transform:scaleX(1)}}
#awa-lernziele .dash{stroke-dasharray:4 6;animation:awa-dash 9s linear infinite}
@keyframes awa-dash{to{stroke-dashoffset:-100}}
#awa-lernziele .draw{stroke-dasharray:var(--len,200);stroke-dashoffset:var(--len,200)}
#awa-lernziele .awa-plate.open .draw{animation:awa-draw 1.2s .25s var(--soft) forwards}
@keyframes awa-draw{to{stroke-dashoffset:0}}
#awa-lernziele .scan{animation:awa-scan 3.4s ease-in-out infinite}
@keyframes awa-scan{0%,100%{transform:translateY(0)}50%{transform:translateY(74px)}}
#awa-lernziele .ping{transform-box:fill-box;transform-origin:center;animation:awa-ping 2.6s ease-out infinite}
#awa-lernziele .ping.b{animation-delay:.65s}
#awa-lernziele .ping.c{animation-delay:1.3s}
@keyframes awa-ping{0%{transform:scale(.55);opacity:.8}70%{opacity:0}100%{transform:scale(1.45);opacity:0}}
#awa-lernziele .blink{animation:awa-blink 2.6s ease-in-out infinite}
#awa-lernziele .blink.b{animation-delay:.65s}
#awa-lernziele .blink.c{animation-delay:1.3s}
@keyframes awa-blink{0%,55%,100%{opacity:.2}12%,32%{opacity:1}}
#awa-lernziele .sweep{transform-box:view-box;animation:awa-sweep 5.4s linear infinite}
@keyframes awa-sweep{to{transform:rotate(360deg)}}
#awa-lernziele .wave{transform-box:fill-box;transform-origin:0 50%;animation:awa-wave 2.4s ease-in-out infinite}
@keyframes awa-wave{0%,100%{transform:skewY(-5deg) scaleX(1)}50%{transform:skewY(5deg) scaleX(.93)}}
#awa-lernziele .drop{transform-box:fill-box;animation:awa-drop 3.6s ease-in-out infinite}
#awa-lernziele .drop.b{animation-delay:1.2s}
#awa-lernziele .drop.c{animation-delay:2.4s}
@keyframes awa-drop{0%,100%{transform:translateY(-3px);opacity:.5}45%,62%{transform:translateY(3px);opacity:1}}

/* ===== Atmosphäre ===== */
#awa-lernziele .awa-haze{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 26% 30% at 50% 46%,#ffffffcc,#ffffff00 72%),
             radial-gradient(ellipse 86% 86% at 50% 50%,#ffffff00 58%,#0c263012 100%)}
#awa-lernziele .awa-beam{position:absolute;top:0;bottom:0;left:-38%;width:30%;pointer-events:none;
  background:linear-gradient(100deg,#ffffff00,#fff6d9b3 38%,#ffffffd9 55%,#ffffff00);
  transform:skewX(-14deg);opacity:0;animation:awa-beam 2.5s .35s var(--soft) 1}
@keyframes awa-beam{0%{left:-38%;opacity:0}22%{opacity:.95}100%{left:118%;opacity:0}}

/* ===== UI ===== */
#awa-lernziele .awa-ui{position:absolute;inset:0;pointer-events:none}
#awa-lernziele .awa-ui>*{pointer-events:auto}
#awa-lernziele .awa-btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:8px;
  height:40px;padding:0 16px;border:1px solid #0c5469;border-radius:9px;
  background:linear-gradient(180deg,#1a8d99 0%,#0f6f7b 48%,#0c5469 100%);
  box-shadow:inset 0 1px 0 #ffffff59,0 6px 16px -6px #075b6666;color:#fff;
  font:500 15px/1 "Be Vietnam Pro","BeVietnamLocal",Arial,sans-serif;cursor:pointer;
  transition:box-shadow .25s,opacity .25s;-webkit-tap-highlight-color:transparent}
#awa-lernziele .awa-btn::after{content:"";position:absolute;top:0;bottom:0;left:-40%;width:30%;
  background:linear-gradient(100deg,transparent,#ffffff6b,transparent);transform:skewX(-18deg);opacity:0;pointer-events:none}
#awa-lernziele .awa-btn:hover::after{animation:awa-streak .7s var(--ease)}
@keyframes awa-streak{0%{left:-40%;opacity:1}100%{left:120%;opacity:1}}
#awa-lernziele .awa-btn:hover{box-shadow:inset 0 1px 0 #ffffff80,0 8px 20px -6px #075b6673}
#awa-lernziele .awa-ghost{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 15px;
  border:1px solid var(--line2);border-radius:9px;
  background:linear-gradient(180deg,#ffffff,#f4fafb);box-shadow:0 5px 14px -8px #0c263040;
  color:var(--deep);font:500 15px/1 "Be Vietnam Pro","BeVietnamLocal",Arial,sans-serif;cursor:pointer;
  transition:border-color .25s,box-shadow .25s;-webkit-tap-highlight-color:transparent}
#awa-lernziele .awa-ghost:hover{border-color:var(--petrol);box-shadow:0 7px 18px -8px #0c26304d}
#awa-lernziele .awa-glass{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 13px;
  border:1px solid #ffffffd9;border-radius:18px;background:#ffffffbf;color:var(--head);
  font:400 14.5px/1 "Be Vietnam Pro","BeVietnamLocal",Arial,sans-serif;
  box-shadow:0 8px 20px -10px #0c263059;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  cursor:pointer;transition:background .25s,box-shadow .25s}
#awa-lernziele .awa-glass:hover{background:#fff;box-shadow:0 10px 24px -10px #0c263066}
#awa-lernziele .awa-btn:focus-visible,#awa-lernziele .awa-ghost:focus-visible,
#awa-lernziele .awa-glass:focus-visible,#awa-lernziele .awa-rb:focus-visible,
#awa-lernziele .awa-dot:focus-visible,#awa-lernziele .awa-mini:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

#awa-lernziele .awa-top{position:absolute;top:14px;right:14px;display:flex;gap:8px}
#awa-lernziele .awa-brand{position:absolute;top:14px;left:18px;display:flex;align-items:center;gap:8px;
  color:var(--petrol);font-size:12.5px;letter-spacing:.2em;pointer-events:none}
#awa-lernziele .awa-brand i{display:block;width:18px;height:2px;border-radius:1px;background:linear-gradient(90deg,var(--petrol),var(--gold))}

#awa-lernziele .awa-rail{position:absolute;right:16px;top:50%;transform:translateY(-50%);
  display:flex;flex-direction:column;gap:11px}
#awa-lernziele .awa-dot{position:relative;width:11px;height:11px;padding:0;border:2px solid #13808c80;
  border-radius:50%;background:#ffffffd9;cursor:pointer;
  transition:transform .3s var(--ease),background .3s,border-color .3s,box-shadow .3s}
#awa-lernziele .awa-dot::after{content:attr(data-l);position:absolute;right:21px;top:50%;transform:translateY(-50%) translateX(4px);
  padding:4px 10px;border-radius:9px;background:#0C2630f2;color:#fff;font-size:12.5px;white-space:nowrap;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .25s var(--ease)}
#awa-lernziele .awa-dot:hover::after,#awa-lernziele .awa-dot:focus-visible::after{opacity:1;transform:translateY(-50%)}
#awa-lernziele .awa-dot.seen{background:var(--gold);border-color:#e0ad00}
#awa-lernziele .awa-dot.cur{transform:scale(1.5);border-color:var(--deep);box-shadow:0 0 0 4px #13808c24}

#awa-lernziele .awa-prog{position:absolute;left:20px;bottom:17px;display:flex;align-items:center;gap:11px;
  color:var(--muted);font-size:13px;letter-spacing:.05em;pointer-events:none}
#awa-lernziele .awa-prog b{font-weight:500;color:var(--deep)}
#awa-lernziele .awa-prog i{position:relative;display:block;width:88px;height:2px;background:#0c263021;overflow:hidden;border-radius:1px}
#awa-lernziele .awa-prog i u{position:absolute;inset:0;text-decoration:none;
  background:linear-gradient(90deg,var(--petrol),var(--gold));transform-origin:0 50%;transform:scaleX(var(--p,0))}
#awa-lernziele .awa-nav{position:absolute;right:16px;bottom:15px;display:flex;align-items:center;gap:8px}
#awa-lernziele .awa-rb{display:grid;place-items:center;width:40px;height:40px;padding:0;
  border:1px solid var(--line2);border-radius:50%;background:linear-gradient(180deg,#ffffff,#f4fafb);
  color:var(--deep);box-shadow:0 5px 14px -8px #0c263040;cursor:pointer;transition:border-color .25s,opacity .25s}
#awa-lernziele .awa-rb:hover{border-color:var(--petrol)}
#awa-lernziele .awa-rb[disabled]{opacity:.4;cursor:default}
#awa-lernziele .awa-rb svg{transform:rotate(180deg)}

/* ===== Bildunterschrift ===== */
#awa-lernziele .awa-cap{position:absolute;bottom:62px;width:min(430px,calc(100% - 44px));
  opacity:0;transform:translateY(16px);filter:blur(5px);pointer-events:none;
  transition:opacity .5s var(--ease),transform .65s var(--ease),filter .5s var(--ease)}
#awa-lernziele .awa-cap.on{opacity:1;transform:none;filter:none}
#awa-lernziele .awa-cap.l{left:20px}
#awa-lernziele .awa-cap.r{right:52px}
#awa-lernziele .awa-ct{position:relative;margin:0;padding:13px 16px 14px 17px;border-radius:13px;
  background:linear-gradient(100deg,#fffdf5 0%,#ffffff 42%,#f7fcfc 100%);
  box-shadow:0 0 0 1px #e4ecee,0 18px 34px -18px #0c263059;
  color:var(--ink);font-size:16px;line-height:1.5;hyphens:auto;overflow:hidden}
#awa-lernziele .awa-ct::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:linear-gradient(180deg,var(--gold),#13808c)}
#awa-lernziele .awa-cl{display:block;margin:0 0 4px;color:var(--petrol);font-size:12.5px;letter-spacing:.17em}
#awa-lernziele .awa-key{background:linear-gradient(90deg,var(--gold),#fec70b4d) no-repeat 0 100%/0% 2px;
  padding-bottom:1px;color:var(--deep);transition:background-size 1s .45s var(--ease)}
#awa-lernziele .awa-cap.on .awa-key{background-size:100% 2px}

/* ===== Hinweis am geschlossenen Bild ===== */
#awa-lernziele .awa-tip{position:absolute;left:50%;bottom:66px;transform:translate(-50%,10px);
  display:inline-flex;align-items:center;gap:10px;padding:7px 15px 7px 11px;border-radius:21px;
  background:#ffffffd9;box-shadow:0 0 0 1px #e4ecee,0 10px 24px -14px #0c263066;
  color:var(--deep);font-size:14.5px;white-space:nowrap;pointer-events:none;opacity:0;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  transition:opacity .45s var(--ease),transform .5s var(--ease)}
#awa-lernziele .awa-tip.on{opacity:1;transform:translate(-50%,0)}

/* ===== Start ===== */
#awa-lernziele .awa-intro{position:absolute;left:0;right:0;bottom:62px;display:grid;justify-items:center;
  gap:9px;padding:0 24px;text-align:center;pointer-events:none;
  transition:opacity .55s var(--ease),transform .6s var(--ease)}
#awa-lernziele .awa-intro.off{opacity:0;transform:translateY(14px)}
#awa-lernziele .awa-intro h2{margin:0;color:var(--head);font-size:31px;line-height:1.14;font-weight:500;letter-spacing:-.01em}
#awa-lernziele .awa-intro p{margin:0;color:var(--muted);font-size:16px}
#awa-lernziele .awa-eyebrow{display:inline-flex;align-items:center;gap:9px;color:var(--petrol);font-size:12.5px;letter-spacing:.22em}
#awa-lernziele .awa-eyebrow::before,#awa-lernziele .awa-eyebrow::after{content:"";display:block;width:22px;height:1px;background:linear-gradient(90deg,#13808c00,#13808c)}
#awa-lernziele .awa-eyebrow::after{background:linear-gradient(90deg,#13808c,#13808c00)}
#awa-lernziele .awa-hint{display:inline-flex;align-items:center;gap:10px;margin-top:4px;padding:7px 15px 7px 11px;
  border-radius:21px;background:#ffffffd9;box-shadow:0 0 0 1px #e4ecee,0 10px 24px -14px #0c263066;
  color:var(--deep);font-size:14.5px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#awa-lernziele .awa-mouse{position:relative;width:19px;height:28px;border:2px solid var(--petrol);border-radius:10px;flex:none}
#awa-lernziele .awa-mouse::after{content:"";position:absolute;left:50%;top:5px;width:3px;height:7px;margin-left:-1.5px;
  border-radius:2px;background:var(--gold);animation:awa-wheel 1.7s ease-in-out infinite}
@keyframes awa-wheel{0%{opacity:0;transform:translateY(-2px)}30%{opacity:1}100%{opacity:0;transform:translateY(9px)}}
#awa-lernziele .awa-swipe{width:24px;height:24px;color:var(--petrol);flex:none;animation:awa-sw 1.9s ease-in-out infinite}
@keyframes awa-sw{0%,100%{transform:translateX(5px)}50%{transform:translateX(-5px)}}

/* ===== Überblick am Ende ===== */
#awa-lernziele .awa-out{position:absolute;left:50%;top:50%;width:min(620px,calc(100% - 36px));
  padding:22px 24px 20px;border-radius:18px;text-align:center;
  background:linear-gradient(170deg,#ffffffeb,#f6fbfbe6);
  box-shadow:0 0 0 1px #e4ecee,0 30px 60px -28px #0c26305c;
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  transform:translate(-50%,-44%) scale(.97);opacity:0;visibility:hidden;
  transition:opacity .5s,transform .6s var(--ease),visibility 0s .5s}
#awa-lernziele .awa-out.on{opacity:1;visibility:visible;transform:translate(-50%,-50%);
  transition:opacity .5s,transform .6s var(--ease)}
#awa-lernziele .awa-out h2{margin:8px 0 5px;color:var(--head);font-size:25px;line-height:1.2;font-weight:500}
#awa-lernziele .awa-out p{margin:0 0 15px;color:var(--muted);font-size:15.5px}
#awa-lernziele .awa-minis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin:0 0 17px}
#awa-lernziele .awa-mini{position:relative;display:grid;gap:7px;justify-items:center;padding:13px 8px 11px;border:1px solid var(--line);
  border-radius:13px;background:linear-gradient(180deg,#ffffff,#f4fafb);cursor:pointer;
  font:400 13.5px/1.3 "Be Vietnam Pro","BeVietnamLocal",Arial,sans-serif;color:var(--ink);text-align:center;
  transition:transform .3s var(--ease),border-color .3s,box-shadow .3s}
#awa-lernziele .awa-mini::before{content:"";position:absolute;left:14px;right:14px;top:0;height:2px;border-radius:0 0 2px 2px;
  background:linear-gradient(90deg,#ffffff00,var(--a1,#13808c),#ffffff00)}
#awa-lernziele .awa-mini:hover{transform:translateY(-3px);border-color:var(--petrol);box-shadow:0 12px 24px -16px #0c263080}
#awa-lernziele .awa-mini i{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;
  border:1px solid var(--line2);background:#fff;color:var(--petrol);
  box-shadow:0 0 0 3px #13808c14}
#awa-lernziele .awa-mini i svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#awa-lernziele .awa-mini b{display:block;color:var(--petrol);font-size:11.5px;font-weight:400;letter-spacing:.14em}
#awa-lernziele .awa-ob{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}

/* ===== Alle Lernziele ===== */
#awa-lernziele .awa-list{position:absolute;inset:0;z-index:9;overflow:auto;padding:22px;
  background:#f7fbfbf5;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  opacity:0;visibility:hidden;transition:opacity .4s,visibility 0s .4s;overscroll-behavior:contain}
#awa-lernziele .awa-list.on{opacity:1;visibility:visible;transition:opacity .4s}
#awa-lernziele .awa-lh{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 13px}
#awa-lernziele .awa-lh p{margin:0;color:var(--head);font-size:17px;font-weight:500}
#awa-lernziele .awa-goals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;margin:0;padding:0;list-style:none}
#awa-lernziele .awa-goal{position:relative;display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;
  align-items:start;padding:13px 15px 14px 13px;border-radius:14px;
  background:linear-gradient(168deg,#ffffff 60%,#f6fbfb);box-shadow:0 0 0 1px #e4ecee,0 10px 22px -18px #0c26304d}

#awa-lernziele .awa-node svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#awa-lernziele .awa-goal p{margin:0;font-size:15.5px;line-height:1.5;hyphens:auto;overflow-wrap:break-word}
#awa-lernziele .awa-st{display:block;margin:0 0 3px;color:var(--petrol);font-size:13px;letter-spacing:.04em}
#awa-lernziele .awa-list .awa-key{background-size:100% 2px}
#awa-lernziele .awa-lead{margin:0 0 13px;color:var(--muted);font-size:15px}

/* Gravur-Rosette wie auf einer Urkunde (Hypotrochoide) */
function rosette(k,d,R,N,rot){
 var p=[],i,t,a=R-R/(k+1),c=Math.cos(rot||0),s=Math.sin(rot||0),x,y;
 for(i=0;i<=N;i++){t=2*Math.PI*i/N;
  x=a*Math.cos(t)+d*Math.cos(k*t);y=a*Math.sin(t)-d*Math.sin(k*t);
  p.push((x*c-y*s).toFixed(2)+','+(x*s+y*c).toFixed(2));}

}

  p.push((cx+Math.cos(a)*(i%2?r:R)).toFixed(2)+','+(cy+Math.sin(a)*(i%2?r:R)).toFixed(2));}

  put(ribL[i],-C.HW,ym,z,op*.9);put(ribR[i],C.HW,ym,z,op*.9);}

 for(i=0;i<fbars.length;i++){z=(k0+i)*C.flr-camZ;put(fbars[i],0,C.FH,z,clamp((zFar-z)/fo,0,1)*.85);}

  z=(m.Z-camZ-zNear)%span;if(z<0)z+=span;z+=zNear;
  put(m.o,m.X,m.Y,z,clamp((zFar-z)/fo,0,1)*.7);}

  var x=exs[i];z=x.Z-camZ;
  if(z<C.f*.16||z>zFar*1.15){if(x.v!==0){x.v=0;x.el.style.visibility='hidden';}continue;}
  if(x.v!==1){x.v=1;x.el.style.visibility='visible';if(!x.h)x.h=x.el.offsetHeight;}
  if(!x.h)x.h=x.el.offsetHeight||C.eh;
  x.el.style.transform='translate3d('+(cx+x.X-x.w*.5).toFixed(1)+'px,'+(cy+x.Y-x.h*.5).toFixed(1)+
   'px,'+(C.f-z).toFixed(1)+'px) rotateY('+x.a+'deg)';
  op=Math.round(clamp((zFar*1.1-z)/fo,0,1)*clamp((z-C.f*C.ef)/(C.f*.42),0,1)*(DEKOR==='leise'?.46:1)*50)/50;
  if(op!==x.o){x.o=op;x.el.style.opacity=op;}
 }
 for(i=0;i<4;i++){
  var p=plates[i],sg=i%2===0?1:-1;z=ZW[i]-camZ;
  /* Das Bild öffnet sich, sobald man beim Herangehen die Schwelle überschreitet */
  var A=stops[RAIL[i+1]-1].z,B=stops[RAIL[i+1]].z,opn=camZ>=A+(B-A)*.42;
  if(opn!==p.open){p.open=opn;p.el.classList.toggle('open',opn);}
  /* Beim Weitergehen löst sich das Bild auf, statt an der Kamera vorbeizuschrammen */
  if(z<C.f*.6||z>zFar){show(p,0);show(washes[i],0);show(pools[i],0);continue;}
  show(p,1);show(washes[i],1);show(pools[i],1);
  op=clamp((zFar-z)/fo,0,1)*clamp((z-C.f*.62)/(C.f*.34),0,1);
  put(p,sg*C.ox,oy,z,op);
  put(washes[i],sg*C.HW*.76,oy,z+C.gap*.12,op*(opn?1:.45));
  put(pools[i],sg*C.ox,C.FH-8,z+12,op*(opn?.85:.4));
  var vl=Math.round(clamp((z-C.f)/(zFar-C.f),0,1)*34)/50;
  if(vl!==p.vl){p.vl=vl;p.el.style.setProperty('--veil',vl);}
 }
}
function nearest(v){var b=0,bd=1e9,i,d;for(i=0;i<stops.length;i++){d=Math.abs(v-stops[i].z);if(d<bd){bd=d;b=i;}}return b;}
function ui(){
 var si=nearest(camZ),s=stops[si],st=s.st,i,p;
 for(i=0;i<4;i++)if(plates[i]&&plates[i].open&&!seen[i+1]){seen[i+1]=true;if(dots[i+1])dots[i+1].classList.add('seen');}
 if(camZ<70&&!seen[0]){seen[0]=true;if(dots[0])dots[0].classList.add('seen');}
 if(camZ>maxZ-90&&!seen[5]){seen[5]=true;if(dots[5])dots[5].classList.add('seen');}
 var ts=stops[nearest(tgt)].st;
 for(i=0;i<dots.length;i++)dots[i].classList.toggle('cur',i===ts);
 $('awa-bar').style.setProperty('--p',(camZ/maxZ).toFixed(3));
 /* Der Text erscheint erst, wenn sich das Bild geöffnet hat */
 var ing=false,tip=false;
 if(st>=1&&st<=4){
  var A=stops[RAIL[st]-1].z,B=stops[RAIL[st]].z,sp=B-A;p=plates[st-1];
  ing=!!(p&&p.open)&&camZ<B+sp*1.3;
  tip=!!(p&&!p.open)&&camZ>A-sp*.8;
 }
 if(st!==lastIdx||ing!==lastNear){
  lastIdx=st;lastNear=ing;
  if(ing){var g=G[st-1];
   capEl.classList.remove('on','l','r');
   capEl.classList.add((st-1)%2===0?'l':'r');
   $('awa-cx').innerHTML=mark(g.t,g.k);
   void capEl.offsetWidth;capEl.classList.add('on');
  }else capEl.classList.remove('on');
  $('awa-no').textContent=pad(st===5?4:st);
 }
 if(s.nm!==lastNm){lastNm=s.nm;$('awa-nm').textContent=s.nm;}
 if(tip!==lastTip){lastTip=tip;tipEl.classList.toggle('on',tip);}
 introEl.classList.toggle('off',camZ>stops[1].z*.55);
 outEl.classList.toggle('on',camZ>maxZ-C.gap*.42);
 var t=nearest(tgt),tk=stops[t].k;
 prevB.disabled=t===0;
 var end=camZ>maxZ-C.gap*.42;
 if(end!==lastEnd){lastEnd=end;nextB.style.display=end?'none':'';}
 var lb=tk==='start'?'Rundgang starten':(tk==='closed'?'Lernziel zeigen'
   :(t===stops.length-2?'Zum \u00dcberblick':'Weiter'));
 if(lb!==lastLb){lastLb=lb;nextB.innerHTML=ico('arrow')+'<span>'+lb+'</span>';}
}
/* ===== Schleife ===== */
function loop(now){
 var dt=Math.min(64,now-(last||now));last=now;
 var k=reduce?1:1-Math.exp(-dt/205);
 camZ+=(tgt-camZ)*k;if(Math.abs(tgt-camZ)<.35)camZ=tgt;
 if(!reduce){var kp=1-Math.exp(-dt/250);panX+=(tpx-panX)*kp;panY+=(tpy-panY)*kp;
  scene.style.transform='translate3d('+panX.toFixed(2)+'px,'+panY.toFixed(2)+'px,0)';}
 render();ui();
 if(camZ!==tgt||Math.abs(tpx-panX)>.06||Math.abs(tpy-panY)>.06)raf=requestAnimationFrame(loop);
 else{raf=0;last=0;}
}
function kick(){if(!raf){last=0;raf=requestAnimationFrame(loop);}}
function goTo(i){tgt=stops[clamp(i,0,stops.length-1)].z;kick();}
var snapT=0;
function snapSoon(ms){clearTimeout(snapT);snapT=setTimeout(function(){tgt=stops[nearest(tgt)].z;kick();},ms);}

/* ===== Eingaben ===== */
stage.addEventListener('wheel',function(e){
 if(listEl.classList.contains('on'))return;
 var d=Math.abs(e.deltaY)>=Math.abs(e.deltaX)?e.deltaY:e.deltaX;
 d*=e.deltaMode===1?16:(e.deltaMode===2?400:1);
 if((tgt<=.5&&d<0)||(tgt>=maxZ-.5&&d>0))return;
 e.preventDefault();tgt=clamp(tgt+d*C.gap/470,0,maxZ);kick();snapSoon(185);
},{passive:false});
var drag=null;
stage.addEventListener('pointerdown',function(e){
 if(e.target.closest&&e.target.closest('button,.awa-list,.awa-out'))return;
 drag={x:e.clientX,y:e.clientY,t:tgt,ms:performance.now(),on:false,id:e.pointerId,el:e.target};
});
stage.addEventListener('pointermove',function(e){
 if(e.pointerType==='mouse'&&!reduce){var r=stage.getBoundingClientRect();
  tpx=(.5-(e.clientX-r.left)/r.width)*18;tpy=(.5-(e.clientY-r.top)/r.height)*11;kick();}
 if(!drag)return;
 var dx=e.clientX-drag.x,dy=e.clientY-drag.y;
 if(!drag.on){
  if(Math.abs(dx)>8&&Math.abs(dx)>Math.abs(dy)){drag.on=true;stage.classList.add('drag');
   try{stage.setPointerCapture(drag.id);}catch(x){}}
  else if(Math.abs(dy)>10){drag=null;return;}
 }
 if(drag.on){tgt=clamp(drag.t-dx*C.gap/(stage.clientWidth*.62),0,maxZ);kick();}
});
function endDrag(e){
 if(!drag)return;var o=drag;drag=null;stage.classList.remove('drag');
 if(!o.on){
  var pl=o.el&&o.el.closest?o.el.closest('.awa-plate'):null;
  if(pl){var k=+pl.getAttribute('data-i');goTo(RAIL[k+1]+(plates[k]&&plates[k].open?1:0));}
  return;
 }
 var dx=e.clientX-o.x,v=dx/Math.max(1,performance.now()-o.ms),from=nearest(o.t);
 if(Math.abs(v)>.33||Math.abs(dx)>stage.clientWidth*.17)goTo(from+(dx<0?1:-1));
 else{tgt=stops[nearest(tgt)].z;kick();}
}
stage.addEventListener('pointerup',endDrag);
stage.addEventListener('pointercancel',endDrag);
stage.addEventListener('pointerleave',function(e){if(e.pointerType==='mouse'){tpx=0;tpy=0;kick();}});
stage.addEventListener('keydown',function(e){
 if(listEl.classList.contains('on')){if(e.key==='Escape')closeList();return;}
 if(e.target!==stage)return;
 var t=nearest(tgt);
 if(['ArrowDown','ArrowRight','PageDown',' '].indexOf(e.key)>=0){if(t<stops.length-1){e.preventDefault();goTo(t+1);}}
 else if(['ArrowUp','ArrowLeft','PageUp'].indexOf(e.key)>=0){if(t>0){e.preventDefault();goTo(t-1);}}
 else if(e.key==='Home'){e.preventDefault();goTo(0);}
 else if(e.key==='End'){e.preventDefault();goTo(stops.length-1);}
});
nextB.addEventListener('click',function(){var t=nearest(tgt);goTo(t===stops.length-1?0:t+1);});
prevB.addEventListener('click',function(){goTo(nearest(tgt)-1);});
dots.forEach(function(b,i){b.addEventListener('click',function(){goTo(RAIL[i]);});});
[].slice.call(root.querySelectorAll('.awa-mini')).forEach(function(b){
 b.addEventListener('click',function(){goTo(RAIL[+b.getAttribute('data-i')]);});
});
function openList(){listEl.classList.add('on');
 for(var i=1;i<=4;i++){seen[i]=true;if(dots[i])dots[i].classList.add('seen');}
 $('awa-close').focus({preventScroll:true});}
function closeList(){listEl.classList.remove('on');stage.focus({preventScroll:true});}
allB.addEventListener('click',openList);
$('awa-read').addEventListener('click',openList);
$('awa-close').addEventListener('click',closeList);
$('awa-again').addEventListener('click',function(){goTo(0);});
listEl.addEventListener('wheel',function(e){e.stopPropagation();},{passive:true});

/* ===== Rise: Blockhöhe melden ===== */
function notify(){if(window.parent!==window){var h=document.documentElement.scrollHeight;
 window.parent.postMessage({type:'resize',height:h},'*');
 window.parent.postMessage({type:'embed:resize',height:h},'*');}}
var lastW=-1;
function onSize(){var w=root.clientWidth;if(w!==lastW){lastW=w;build();}notify();}
if(window.ResizeObserver)new ResizeObserver(onSize).observe(root);
else window.addEventListener('resize',onSize);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){lastW=-1;onSize();});
window.addEventListener('load',function(){lastW=-1;onSize();});
build();notify();kick();
})();
</script>
</body>
</html>
